<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Premium Editorial Bookstore</title>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const v = params.get('v') || String(Date.now());
      window.__assetVersion = v;
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = `app.css?v=${encodeURIComponent(v)}`;
      document.head.appendChild(link);
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">📚 Premium Editorial Bookstore</div>
    <div class="nav-right">
      <button id="open-wishlist" class="icon-btn">♡ <span id="wishCount" class="count">0</span></button>
      <button id="open-cart" class="btn-primary">Cart <span id="cartCount" class="count">0</span></button>
    </div>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <div class="hero-text">
        <div class="eyebrow">Featured editorial</div>
        <h1>Discover books by description, mood or theme</h1>
        <p class="muted">Editorially curated picks, smart search, and community reviews.</p>

        <div class="search-row">
          <div class="search-wrapper">
            <input id="searchInput" placeholder="e.g. cozy mystery with witty heroine" autocomplete="off" />
            <div id="suggestions" class="suggestions" aria-hidden="true"></div>
          </div>

          <div class="controls">
            <select id="sortSelect" class="select">
              <option value="featured">Featured</option>
              <option value="rating">Most Rated</option>
              <option value="newest">Newest</option>
              <option value="az">A → Z</option>
            </select>
            <button id="clearFilters" class="btn-ghost">Clear Filters</button>
          </div>
        </div>
      </div>

      <div class="featured-hero">
        <div id="featuredCover" class="featured-cover" role="img" aria-label="Featured cover"></div>
        <div class="featured-body">
          <div class="featured-eyebrow">Featured</div>
          <h2 id="featuredTitle">—</h2>
          <p id="featuredDesc" class="muted">Curated selection from our editors.</p>
          <div id="featuredMeta" class="muted"></div>
          <div style="margin-top:12px">
            <button id="featuredView" class="btn-primary">View Featured</button>
            <button id="featuredAddCart" class="btn-ghost">Add to cart</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <main class="main">
    <section class="panel">
      <div class="panel-header">
        <h2>Books</h2>
        <div id="activeFilters" class="muted small"></div>
      </div>

      <div id="searchResults" class="books-grid"></div>

      <div id="pagination" class="pager"></div>
    </section>

    <aside class="sidepanel">
      <div class="card">
        <h3>Popular</h3>
        <div id="popularList" class="side-list"></div>
      </div>

      <div class="card">
        <h3>Recommended</h3>
        <div id="userRecList" class="side-list"></div>
      </div>
    </aside>
  </main>

  <!-- Book Modal -->
  <div id="modal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-content" id="modalContent" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Cart & Wishlist Drawers -->
  <div id="cartDrawer" class="drawer hidden" aria-hidden="true">
    <div class="drawer-header"><h3>Cart</h3><button id="closeCart" class="btn-ghost">Close</button></div>
    <div id="cartItems" class="drawer-body"></div>
    <div class="drawer-footer"><div id="cartTotal">Total: $0.00</div><button id="checkoutBtn" class="btn-primary">Checkout</button></div>
  </div>

  <div id="wishDrawer" class="drawer hidden" aria-hidden="true">
    <div class="drawer-header"><h3>Wishlist</h3><button id="closeWish" class="btn-ghost">Close</button></div>
    <div id="wishItems" class="drawer-body"></div>
  </div>
  <script>
    (function () {
      const v = window.__assetVersion || String(Date.now());
      const script = document.createElement('script');
      script.src = `app.js?v=${encodeURIComponent(v)}`;
      script.defer = true;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
